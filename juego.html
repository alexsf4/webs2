<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Encuentra los pares</title>
<style>
:root{--bg:#121212;--panel:#181818;--text:#fff;--muted:#b3b3b3;--green:#1ed760}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:linear-gradient(180deg,#5a2a3a 0%,#2b1a22 30%,var(--bg) 100%) fixed;color:var(--text);font-family:"Circular","Helvetica Neue",Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px 12px calc(16px + env(safe-area-inset-bottom,0px));padding-top:calc(12px + env(safe-area-inset-top,0px));user-select:none;-webkit-user-select:none}
a{color:var(--muted);text-decoration:none;font-size:.85rem}
a:hover{color:var(--text)}
button{border:0;cursor:pointer;font:inherit}
button:focus-visible,a:focus-visible,.card:focus-visible{outline:2px solid var(--green);outline-offset:2px}

.top{width:min(100%,560px);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
h1{width:min(100%,560px);font-size:1.4rem;font-weight:900;letter-spacing:-.02em;margin-bottom:4px}
.hud{width:min(100%,560px);display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-bottom:10px}
.hud b{color:var(--text)}
#estado{width:min(100%,560px);min-height:1.2em;color:var(--green);font-size:.85rem;font-weight:700;margin-bottom:8px}

.grid{width:min(100%,560px);display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (min-width:640px){.grid{grid-template-columns:repeat(5,1fr);gap:10px}}

.card{position:relative;aspect-ratio:1/1.15;perspective:700px;background:none;transition:transform .55s cubic-bezier(.3,.7,.3,1);-webkit-tap-highlight-color:transparent}
.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .4s}
.card.flipped .inner,.card.matched .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:8px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.back{background:linear-gradient(135deg,#2a2a2a,#1c1c1c);border:1px solid #333;display:grid;place-items:center;font-size:1.8rem}
.card:hover .back{background:linear-gradient(135deg,#3a3a3a,#242424)}
.front{transform:rotateY(180deg);background:#333}
.front img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.card.matched .front{box-shadow:0 0 0 3px var(--green)}
.card.matched{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.07)}}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center;z-index:5}
.ov[hidden]{display:none}
.ov .box{max-width:420px;display:flex;flex-direction:column;gap:14px;align-items:center}
.ov .big{font-size:3rem}
.ov h2{font-size:clamp(1.5rem,6vw,2.1rem);font-weight:900;letter-spacing:-.02em}
.ov p{color:var(--muted);line-height:1.55;font-size:.95rem}
.btn{background:var(--green);color:#000;font-weight:700;padding:13px 32px;border-radius:999px;transition:transform .1s}
.btn:hover{transform:scale(1.05)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="top"><a href="index.html">← Volver a la playlist</a></div>
<h1 id="titulo"></h1>
<div class="hud"><span>Intentos: <b id="mv">0</b></span><span>Pares: <b id="pr">0/0</b></span><span>Tiempo: <b id="tm">0:00</b></span></div>
<div id="estado"></div>
<div class="grid" id="grid"></div>

<div class="ov" id="ov">
  <div class="box">
    <div class="big" id="ovIcon">🃏</div>
    <h2 id="ovTitle"></h2>
    <p id="ovText"></p>
    <button class="btn" id="go" hidden>Jugar</button>
  </div>
</div>

<script>
/* ============ PERSONALIZA AQUÍ ============ */
const CONFIG = {
  titulo: "Encuentra los pares",
  carpeta: "fotos-juego/",          // carpeta con las fotos
  prefijo: "foto",                  // foto1.jpg, foto2.jpg, ...
  extensiones: ["jpg", "jpeg", "png", "webp"],
  maxFotos: 60,                     // hasta qué número busca (foto1 ... foto60)
  pares: 10,                        // cuántas fotos distintas por partida
  vistaPrevia: 2000,                // ms que se ven las cartas antes de esconderse
  instrucciones: "Memoriza las cartas: se esconderán y se mezclarán. Encuentra todos los pares.",
  tituloGanar: "¡Las encontraste todas!",
  mensajeGanar: "Escribe aquí tu mensaje sorpresa: lo que quieres decirle, una fecha especial, una promesa, etc."
};
/* ========================================== */

const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = s => Math.floor(s/60) + ":" + String(s % 60).padStart(2, "0");

let fotos = null, cards = [], st = "idle", first = null, locked = false, moves = 0, pairs = 0, total = 0, t0 = 0, timer = 0;

$("titulo").textContent = CONFIG.titulo;
document.title = CONFIG.titulo;

/* Busca foto1, foto2, ... en la carpeta (sin API ni servidor) */
function probe(n){
  return new Promise(res => {
    let i = 0;
    const next = () => {
      if (i >= CONFIG.extensiones.length) return res(null);
      const src = CONFIG.carpeta + CONFIG.prefijo + n + "." + CONFIG.extensiones[i++];
      const im = new Image();
      im.onload = () => res(src);
      im.onerror = next;
      im.src = src;
    };
    next();
  });
}
async function descubrir(){
  const r = await Promise.all(Array.from({length: CONFIG.maxFotos}, (_, i) => probe(i + 1)));
  return r.filter(Boolean);
}

function showOv(icon, title, text, btn){
  $("ovIcon").textContent = icon; $("ovTitle").textContent = title; $("ovText").textContent = text;
  $("go").hidden = !btn; if (btn) $("go").textContent = btn;
  $("ov").hidden = false;
}

async function init(){
  showOv("🔎", "Buscando fotos...", "", null);
  fotos = await descubrir();
  if (fotos.length < 2){
    showOv("📁", "Faltan fotos", "Pon al menos 2 fotos en la carpeta \"" + CONFIG.carpeta + "\" con los nombres " + CONFIG.prefijo + "1.jpg, " + CONFIG.prefijo + "2.jpg, ... y recarga la página.", null);
    return;
  }
  showOv("🃏", CONFIG.titulo, CONFIG.instrucciones + "  (" + fotos.length + " fotos disponibles)", "Jugar");
}

function hud(){
  $("mv").textContent = moves;
  $("pr").textContent = pairs + "/" + total;
}

async function nueva(){
  $("ov").hidden = true;
  clearInterval(timer); $("tm").textContent = "0:00";
  st = "prep"; first = null; locked = true; moves = 0; pairs = 0;

  const elegidas = shuffle(fotos).slice(0, Math.min(CONFIG.pares, fotos.length));
  total = elegidas.length; hud();
  const mazo = [...elegidas, ...elegidas].map((src, i) => ({src, k: src, i}));

  const grid = $("grid"); grid.innerHTML = ""; cards = [];
  mazo.forEach(c => {
    const b = document.createElement("button");
    b.className = "card flipped";
    b.dataset.k = c.k;
    b.setAttribute("aria-label", "Carta");
    b.innerHTML = '<div class="inner"><div class="face back">❤️</div><div class="face front"><img alt=""></div></div>';
    b.querySelector("img").src = c.src;
    b.onclick = () => voltear(b);
    grid.appendChild(b); cards.push(b);
  });

  $("estado").textContent = "Memoriza las cartas...";
  await wait(CONFIG.vistaPrevia);
  cards.forEach(c => c.classList.remove("flipped"));
  await wait(550);
  $("estado").textContent = "Mezclando...";
  await barajar();
  $("estado").textContent = "¡Encuentra los pares!";
  st = "play"; locked = false;
}

/* Las cartas viajan al centro, se reordenan al azar y se reparten */
async function barajar(){
  const grid = $("grid");
  const juntar = () => {
    const g = grid.getBoundingClientRect(), cx = g.left + g.width/2, cy = g.top + g.height/2;
    cards.forEach(c => {
      const r = c.getBoundingClientRect();
      const dx = cx - (r.left + r.width/2), dy = cy - (r.top + r.height/2);
      c.style.transform = "translate(" + dx + "px," + dy + "px) rotate(" + (Math.random()*30 - 15) + "deg) scale(.7)";
    });
  };
  for (let ronda = 0; ronda < 2; ronda++){
    juntar();
    await wait(600);
    cards.forEach(c => c.style.transition = "none");
    cards = shuffle(cards);
    cards.forEach(c => { c.style.transform = ""; grid.appendChild(c); });
    juntar();
    void grid.offsetWidth;                       // fuerza el reflow
    cards.forEach(c => c.style.transition = "");
    await wait(30);
    cards.forEach(c => c.style.transform = "");
    await wait(650);
  }
}

function voltear(c){
  if (st !== "play" || locked || c.classList.contains("flipped") || c.classList.contains("matched")) return;
  if (!t0 || !timer){
    t0 = Date.now();
    timer = setInterval(() => $("tm").textContent = fmt((Date.now() - t0) / 1000 | 0), 500);
  }
  c.classList.add("flipped");
  if (!first){ first = c; return; }

  moves++;
  const a = first; first = null;
  if (a.dataset.k === c.dataset.k){
    a.classList.add("matched"); c.classList.add("matched");
    pairs++; hud();
    if (pairs === total) ganar();
  } else {
    locked = true; hud();
    setTimeout(() => { a.classList.remove("flipped"); c.classList.remove("flipped"); locked = false; }, 900);
  }
}

function ganar(){
  st = "over"; clearInterval(timer); timer = 0;
  const seg = (Date.now() - t0) / 1000 | 0; t0 = 0;
  let best = 0; try { best = +localStorage.getItem("mejorMemoria") || 0; } catch(e){}
  const rec = !best || moves < best;
  if (rec) try { localStorage.setItem("mejorMemoria", moves); } catch(e){}
  $("estado").textContent = "";
  setTimeout(() => showOv("💝", CONFIG.tituloGanar,
    CONFIG.mensajeGanar + "  ·  " + moves + " intentos en " + fmt(seg) + (rec ? " · ¡Nuevo récord!" : " · Mejor: " + best + " intentos"),
    "Jugar otra vez"), 900);
}

$("go").onclick = () => { t0 = 0; nueva(); };
init();
</script>
</body>
</html>
