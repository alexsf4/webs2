<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Web Musical</title>
    <style>
        :root {
            --primary: #ff4757;
            --secondary: #ff6b81;
            --bg: #1e1e2f;
            --card-bg: #2d2d44;
            --text: #ffffff;
            --text-secondary: #a4b0be;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1, h2 {
            text-align: center;
            color: var(--primary);
        }
        .search-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .search-box input, .search-box select {
            width: calc(100% - 22px);
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #1a1a29;
            color: white;
            font-size: 16px;
        }
        .search-box button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }
        .search-box button:hover {
            background: var(--secondary);
        }
        .playlists-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .playlists-container {
                grid-template-columns: 1fr;
            }
        }
        .playlist-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .song-list {
            list-style: none;
            padding: 0;
            max-height: 400px;
            overflow-y: auto;
        }
        .song-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1a1a29;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 6px;
        }
        .song-info {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }
        .song-info img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
        }
        .song-title {
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }
        .song-actions {
            display: flex;
            gap: 5px;
        }
        audio {
            width: 100%;
            margin-top: 15px;
        }
        .btn-delete {
            background: #ff4757;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-play {
            background: #2ed573;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        .loading {
            text-align: center;
            color: var(--text-secondary);
            font-style: italic;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💖 Nuestra Web Musical 💖</h1>
        
        <!-- Buscador e integrador con la API de YouTube -->
        <div class="search-box">
            <h2>Agregar Canción con API YouTube</h2>
            <input type="text" id="ytUrl" placeholder="Pega el link de YouTube o nombre de la canción...">
            <select id="targetPlaylist">
                <option value="mia">Mi Playlist (Mis Canciones)</option>
                <option value="ella">Playlist de Ella (Sus Canciones)</option>
            </select>
            <button onclick="addSongFromYouTube()">Buscar y Agregar Automáticamente</button>
            <div id="loadingStatus" class="loading">Consultando API y procesando audio...</div>
        </div>

        <!-- Reproductor Principal -->
        <div class="search-box">
            <h3>Reproduciendo ahora:</h3>
            <p id="currentPlayingTitle" style="color: var(--text-secondary);">Ninguna canción seleccionada</p>
            <audio id="audioPlayer" controls></audio>
        </div>

        <!-- Contenedor de Playlists separadas -->
        <div class="playlists-container">
            <!-- Playlist Mía -->
            <div class="playlist-card">
                <h2>🎵 Mi Playlist</h2>
                <ul id="listMia" class="song-list">
                    <!-- Dinámico -->
                </ul>
            </div>

            <!-- Playlist de Ella -->
            <div class="playlist-card">
                <h2>🎶 Playlist de Ella</h2>
                <ul id="listElla" class="song-list">
                    <!-- Dinámico -->
                </ul>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = "evogb-kOXevp1J";
        let playlists = {
            mia: JSON.parse(localStorage.getItem('playlist_mia')) || [],
            ella: JSON.parse(localStorage.getItem('playlist_ella')) || []
        };

        function savePlaylists() {
            localStorage.setItem('playlist_mia', JSON.stringify(playlists.mia));
            localStorage.setItem('playlist_ella', JSON.stringify(playlists.ella));
            renderPlaylists();
        }

        async function addSongFromYouTube() {
            let inputVal = document.getElementById('ytUrl').value.trim();
            let target = document.getElementById('targetPlaylist').value;
            let statusDiv = document.getElementById('loadingStatus');

            if (!inputVal) {
                alert("Por favor ingresa un enlace válido de YouTube.");
                return;
            }

            let targetUrl = inputVal;
            if (!inputVal.startsWith('http')) {
                alert("Por favor introduce el enlace completo de YouTube (ej. https://www.youtube.com/watch?v=...)");
                return;
            }

            statusDiv.style.display = 'block';

            try {
                const response = await fetch(`https://api.evogb.org/dl/ytmp3?key=${API_KEY}&url=${encodeURIComponent(targetUrl)}`);
                const data = await response.json();

                if (data.status && data.data && data.data.dl) {
                    const newSong = {
                        title: data.data.title || "Canción sin título",
                        thumbnail: data.data.thumbnail || "",
                        audioUrl: data.data.dl
                    };

                    playlists[target].push(newSong);
                    savePlaylists();
                    document.getElementById('ytUrl').value = '';
                    alert("¡Canción agregada con éxito a la playlist!");
                } else {
                    alert("No se pudo obtener el audio con la API. Verifica el enlace.");
                }
            } catch (error) {
                console.error("Error al conectar con la API:", error);
                alert("Hubo un error al procesar la solicitud con la API.");
            } finally {
                statusDiv.style.display = 'none';
            }
        }

        function deleteSong(target, index) {
            playlists[target].splice(index, 1);
            savePlaylists();
        }

        function playSong(title, url) {
            document.getElementById('currentPlayingTitle').innerText = title;
            let player = document.getElementById('audioPlayer');
            player.src = url;
            player.play();
        }

        function renderPlaylists() {
            let listMiaEl = document.getElementById('listMia');
            listMiaEl.innerHTML = '';
            playlists.mia.forEach((song, index) => {
                listMiaEl.innerHTML += `
                    <li class="song-item">
                        <div class="song-info">
                            <img src="${song.thumbnail}" alt="Thumb">
                            <span class="song-title" title="${song.title}">${song.title}</span>
                        </div>
                        <div class="song-actions">
                            <button class="btn-play" onclick="playSong('${song.title.replace(/'/g, "\'")}', '${song.audioUrl}')">▶</button>
                            <button class="btn-delete" onclick="deleteSong('mia', ${index})">✕</button>
                        </div>
                    </li>
                `;
            });

            let listEllaEl = document.getElementById('listElla');
            listEllaEl.innerHTML = '';
            playlists.ella.forEach((song, index) => {
                listEllaEl.innerHTML += `
                    <li class="song-item">
                        <div class="song-info">
                            <img src="${song.thumbnail}" alt="Thumb">
                            <span class="song-title" title="${song.title}">${song.title}</span>
                        </div>
                        <div class="song-actions">
                            <button class="btn-play" onclick="playSong('${song.title.replace(/'/g, "\'")}', '${song.audioUrl}')">▶</button>
                            <button class="btn-delete" onclick="deleteSong('ella', ${index})">✕</button>
                        </div>
                    </li>
                `;
            });
        }

        renderPlaylists();
    </script>
</body>
</html>
