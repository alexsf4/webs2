<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c0f16">
<title>Para ti</title>
<style>
:root{
  --bg:#1c0f16; --panel:#2b1621; --hover:#3a1e2c; --text:#fff5f8; --muted:#d9b3c3; --rosa:#ff6b9d; --linea:#3d2431; --barra:#12080d; --track:#5c3a4a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:"Circular","Helvetica Neue",Helvetica,Arial,sans-serif;padding-bottom:130px}
button{background:none;border:0;color:inherit;cursor:pointer;font:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--rosa);outline-offset:2px}
input[type=text],input[type=password]{background:var(--panel);border:1px solid var(--linea);color:var(--text);border-radius:8px;padding:10px 12px;font:inherit;min-width:0}

.hero{display:flex;gap:24px;align-items:flex-end;padding:56px 32px 28px;background:linear-gradient(180deg,#d1457a 0%,#7a2a4d 45%,#3a1627 75%,var(--bg) 100%)}
.cover{width:min(232px,38vw);aspect-ratio:1;object-fit:cover;border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.55);background:#4a2234;flex:none}
.hero small{font-size:.8rem;font-weight:700}
.hero h1{font-size:clamp(2rem,7vw,5rem);line-height:1.02;font-weight:900;letter-spacing:-.03em;margin:8px 0 14px}
.hero p{color:#f3cfdc;font-size:.9rem;line-height:1.5}
.hero p b{color:var(--text)}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:18px 32px 6px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:20px;background:var(--panel);border:1px solid var(--linea);font-size:.9rem}
.tab:hover{background:var(--hover)}
.tab.on{background:var(--rosa);color:#2b0f1a;border-color:var(--rosa);font-weight:700}
.btn{padding:8px 16px;border-radius:20px;border:1px solid var(--rosa);color:var(--rosa);font-size:.9rem}
.btn:hover{background:var(--rosa);color:#2b0f1a}
.top .btn{margin-left:auto}

.aviso{margin:12px 32px 0;padding:14px 16px;border-radius:10px;background:#4a1d2e;border:1px solid var(--rosa);color:var(--text);font-size:.9rem;line-height:1.5;max-width:640px}
.panel{margin:12px 32px 0;max-width:640px}
.fila{display:flex;gap:8px}
.fila input{flex:1}
.fila .btn{flex:none}

.res{margin-top:10px;border-radius:10px;background:var(--panel);border:1px solid var(--linea);overflow:hidden}
.res .it{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--linea)}
.res .it:last-child{border-bottom:0}
.res img{width:64px;height:48px;object-fit:cover;border-radius:4px;background:#4a2234;flex:none}
.res .tx{flex:1;min-width:0}
.res .tx .t{font-size:.88rem;line-height:1.3;max-height:2.6em;overflow:hidden}
.res .tx .a{font-size:.75rem;color:var(--muted);margin-top:2px}
.res .btn{padding:6px 12px;font-size:.8rem;flex:none}
.res .btn[disabled]{opacity:.5;cursor:default;background:none;color:var(--rosa)}
.nota{color:var(--muted);font-size:.85rem;padding:12px}

.top #btnAnadir{margin-left:auto}
.top #btnEditar{margin-left:0}
.top .edit-only{display:none}
body.edit .top .edit-only{display:inline-block}
#buscador[hidden]{display:none!important}
.estado{color:var(--muted);font-size:.85rem;margin-top:8px;line-height:1.4}
.claves{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.claves p{color:var(--muted);font-size:.8rem;line-height:1.4}
.edit-only{display:none}
body.edit .edit-only{display:block}

.player{display:flex;gap:16px;align-items:center;padding:20px 32px 6px}
#ytwrap,#mp3box{width:100%;max-width:356px;height:200px;border-radius:12px;overflow:hidden;background:#000;flex:none}
#mp3box{display:none;background:var(--panel);align-items:center;justify-content:center}
#mp3box img{width:100%;height:100%;object-fit:cover}
#ytwrap iframe{width:100%;height:100%;display:block}

.list{padding:10px 16px 0}
.head,.row{display:grid;grid-template-columns:40px 1fr 44px;align-items:center;gap:12px;padding:8px 16px;border-radius:6px}
.head{color:var(--muted);font-size:.8rem;border-bottom:1px solid var(--linea);border-radius:0;margin-bottom:8px}
.row{cursor:pointer}
.row:hover{background:var(--hover)}
.row .n{color:var(--muted);text-align:center}
.row .info{display:flex;gap:12px;align-items:center;min-width:0}
.row .info img{width:44px;height:44px;border-radius:4px;object-fit:cover;background:#4a2234;flex:none}
.row .t{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{display:block;color:var(--muted);font-size:.85rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .x{visibility:hidden;color:var(--muted);font-size:1.1rem;padding:6px;border-radius:50%}
body.edit .row .x{visibility:visible}
.row .x:hover{color:#fff;background:#6a2a42}
.row.on .t,.row.on .n{color:var(--rosa)}
.vacio{color:var(--muted);padding:24px 16px;font-size:.9rem}

.msg{margin:40px 32px 0;padding:24px;border-radius:12px;background:var(--panel);border:1px solid var(--linea);max-width:560px;line-height:1.6;color:var(--muted)}
.msg h2{color:var(--rosa);font-size:1.1rem;margin-bottom:8px}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--barra);border-top:1px solid var(--linea);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 2fr 1fr;gap:16px;align-items:center}
.now{display:flex;gap:12px;align-items:center;min-width:0}
.now img{width:56px;height:56px;border-radius:6px;object-fit:cover;background:#4a2234}
.now .t{font-size:.9rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .a{font-size:.75rem;color:var(--muted)}
.mid{display:flex;flex-direction:column;align-items:center;gap:8px}
.btns{display:flex;align-items:center;gap:20px}
.btns svg{width:20px;height:20px;fill:var(--muted)}
.btns button:hover svg{fill:#fff}
.btns .pp{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center}
.btns .pp svg{fill:#2b0f1a;width:16px;height:16px}
.btns .pp:hover{transform:scale(1.06)}
.seek{display:flex;align-items:center;gap:8px;width:100%;max-width:560px;font-size:.7rem;color:var(--muted)}
.seek input{flex:1}
.vol{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.vol input{width:100px}
.vol svg{width:18px;height:18px;fill:var(--muted)}

input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:linear-gradient(to right,#fff var(--v,0%),var(--track) var(--v,0%));cursor:pointer;padding:0;border:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;opacity:0}
input[type=range]:hover{background:linear-gradient(to right,var(--rosa) var(--v,0%),var(--track) var(--v,0%))}
input[type=range]:hover::-webkit-slider-thumb{opacity:1}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}

.toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:#fff;color:#2b0f1a;padding:10px 18px;border-radius:6px;font-size:.85rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:10}
.toast.show{opacity:1}

@media (max-width:700px){
  .hero{flex-direction:column;align-items:flex-start;padding:40px 20px 20px}
  .top{padding:16px 20px 4px}
  .aviso,.panel{margin-left:20px;margin-right:20px}
  .player{padding:16px 20px 4px}
  .list{padding:10px 4px 0}
  .msg{margin:32px 20px 0}
  .bar{grid-template-columns:1fr auto;grid-template-rows:auto auto}
  .mid{grid-column:1/-1;grid-row:2}
  .vol{display:none}
  body{padding-bottom:170px}
  .toast{bottom:180px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="hero">
  <img class="cover" id="cover" alt="Nuestra foto">
  <div>
    <small>Playlist</small>
    <h1 id="title"></h1>
    <p id="desc"></p>
  </div>
</header>

<div class="top">
  <div class="tabs" id="tabs"></div>
  <button class="btn" id="btnAnadir">Añadir música</button>
  <button class="btn" id="btnEditar">Editar listas</button>
</div>

<div class="aviso" id="aviso" hidden></div>

<div class="panel" id="loginBox" hidden>
  <div class="fila">
    <input type="password" id="clave" placeholder="Pega el token de GitHub" autocomplete="current-password">
    <button class="btn" id="btnEntrar">Entrar</button>
  </div>
</div>

<div class="panel edit-only" id="buscador" hidden>
  <div class="fila">
    <input type="text" id="q" placeholder="Busca una canción por nombre" autocomplete="off">
    <button class="btn" id="btnBuscar">Buscar</button>
  </div>
  <div class="res" id="resultados" hidden></div>
  <div class="estado" id="estado" hidden></div>
</div>

<section class="player">
  <div id="ytwrap"><div id="ytplayer"></div></div>
  <div id="mp3box"><img id="mp3img" alt=""></div>
</section>

<main class="list">
  <div class="head"><span style="text-align:center">#</span><span>Título</span><span></span></div>
  <div id="rows"></div>
</main>

<section class="msg">
  <h2 id="msgTitle"></h2>
  <p id="msgText"></p>
</section>

<div class="bar">
  <div class="now">
    <img id="npImg" alt="">
    <div style="min-width:0"><div class="t" id="npTitle">Elige una canción</div><div class="a" id="npArtist"></div></div>
  </div>
  <div class="mid">
    <div class="btns">
      <button id="prev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button class="pp" id="pp" aria-label="Reproducir o pausar"><svg viewBox="0 0 24 24"><path id="ppIcon" d="M8 5v14l11-7z"/></svg></button>
      <button id="next" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    </div>
    <div class="seek"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Progreso"><span id="dur">0:00</span></div>
  </div>
  <div class="vol"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg><input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" aria-label="Volumen"></div>
</div>

<div class="toast" id="toast"></div>
<audio id="audio" preload="metadata"></audio>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
/* ============ PERSONALIZA AQUÍ ============ */
const CONFIG = {
  foto: "https://files.catbox.moe/01jij1.png",
  titulo: "Para mi niña Yaddi",
  de: "Alexander",
  para: "Yaddi",
  descripcion: "Canciones que me recuerdan a ti.",
  mensajeTitulo: "Para ti",
  mensaje: "Estas son canciones que me hacen acordar de ti cada vez que las escucho. Gracias por hacerme sentir amado y enseñarme a amar, porque contigo lo hago siempre.",

  /* Las dos playlists. El "id" no lo cambies después de usarlo (es el nombre de la carpeta en la base de datos). */
  listas: [
    { id: "alexander", nombre: "Playlist de Alexander" },
    { id: "yaddi",     nombre: "Playlist de Yaddi" }
  ],

  /* Tu repositorio de GitHub: aquí se guardan las listas (listas.json) y los mp3 (carpeta musica) */
  github: { usuario: "alexsf4", repo: "webs2", rama: "main" },
  evogbKey: "evogb-kOXevp1J",
  buscaEndpoint: "https://api.evogb.org/search/yt",
  descargaEndpoint: "https://api.evogb.org/dl/ytmp3"
};
/* ========================================== */

const $ = id => document.getElementById(id);
const audio = $("audio");

$("cover").src = $("npImg").src = CONFIG.foto;
$("title").textContent = CONFIG.titulo;
$("desc").innerHTML = `Hecha por <b>${CONFIG.de}</b> para <b>${CONFIG.para}</b><br>${CONFIG.descripcion}`;
$("msgTitle").textContent = CONFIG.mensajeTitulo;
$("msgText").textContent = CONFIG.mensaje;
document.title = CONFIG.titulo;

const fmt = s => isFinite(s) && s > 0 ? Math.floor(s/60) + ":" + String(Math.floor(s%60)).padStart(2,"0") : "0:00";
const PLAY = "M8 5v14l11-7z", PAUSE = "M6 5h4v14H6zm8 0h4v14h-4z";
const fill = el => el.style.setProperty("--v", (el.value - el.min) / (el.max - el.min) * 100 + "%");
function toast(t){ const e=$("toast"); e.textContent=t; e.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove("show"),3200); }
function decodificar(s){ const t=document.createElement("textarea"); t.innerHTML=s; return t.value; }
function setAviso(txt){ const a=$("aviso"); if(txt){ a.textContent=txt; a.hidden=false; } else { a.hidden=true; } }

/* ---------- Almacenamiento en GitHub (listas.json) ---------- */
const G = CONFIG.github;
const API = "https://api.github.com/repos/" + G.usuario + "/" + G.repo + "/contents/";
const TOKEN_KEY = "regalo_gh";
const leerLS = k => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } };
const escribirLS = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} };
const token = () => leerLS(TOKEN_KEY);
const hdr = () => ({ Authorization: "Bearer " + token(), Accept: "application/vnd.github+json" });
const utf8aB64 = t => btoa(unescape(encodeURIComponent(t)));
const b64aUtf8 = b => decodeURIComponent(escape(atob(b.replace(/\s/g, ""))));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
if (!G.usuario || !G.repo) setAviso("Falta poner tu usuario y el nombre del repositorio de GitHub en CONFIG (mira INSTRUCCIONES.txt).");

let datos = {}, tEscritura = 0;
async function leerPublico(){
  const r = await fetch("listas.json?t=" + Date.now(), { cache: "no-store" });
  if (r.status === 404) return {};
  if (!r.ok) throw new Error("HTTP " + r.status);
  return await r.json();
}
async function leerApi(){
  const r = await fetch(API + "listas.json?ref=" + encodeURIComponent(G.rama || "main") + "&t=" + Date.now(), { headers: hdr(), cache: "no-store" });
  if (r.status === 404) return { data: {}, sha: null };
  if (!r.ok) throw new Error("GitHub respondió " + r.status + (r.status === 401 ? " (token inválido)" : ""));
  const j = await r.json();
  return { data: JSON.parse(b64aUtf8(j.content)), sha: j.sha };
}
async function modificarListas(fn, msg){
  for (let i = 0; i < 3; i++) {
    const { data, sha } = await leerApi();
    fn(data);
    const body = { message: msg, content: utf8aB64(JSON.stringify(data, null, 1)), branch: G.rama || "main" };
    if (sha) body.sha = sha;
    const r = await fetch(API + "listas.json", { method: "PUT", headers: Object.assign({ "Content-Type": "application/json" }, hdr()), body: JSON.stringify(body) });
    if (r.ok) { datos = data; tEscritura = Date.now(); mostrarLista(); return; }
    if (r.status !== 409 && r.status !== 422) throw new Error("GitHub respondió " + r.status + (r.status === 401 ? " (token inválido)" : r.status === 403 ? " (al token le falta el permiso Contents: Read and write)" : ""));
  }
  throw new Error("No se pudo guardar, intenta otra vez");
}

/* ---------- Estado ---------- */
let listaActual = CONFIG.listas[0].id;
let canciones = [];       /* canciones de la pestaña que estás viendo */
let cola = [];            /* canciones de la lista que está sonando */
let idx = -1;
let sonandoDocId = null;
let modo = null;          /* "yt" o "mp3" */
let unsub = null;
let editando = false;
let abrirAlEntrar = false;

/* ---------- Pestañas ---------- */
function pintarTabs(){
  const cont = $("tabs"); cont.innerHTML = "";
  CONFIG.listas.forEach(l => {
    const b = document.createElement("button");
    b.className = "tab" + (l.id === listaActual ? " on" : "");
    b.textContent = l.nombre;
    b.onclick = () => { listaActual = l.id; pintarTabs(); cargarLista(); };
    cont.appendChild(b);
  });
}

function mostrarLista(){ canciones = datos[listaActual] || []; pintarFilas(); }
async function refrescar(){
  if (Date.now() - tEscritura < 180000) return; /* GitHub Pages tarda un poco en publicar los cambios */
  try {
    const d = await leerPublico();
    if (JSON.stringify(d) !== JSON.stringify(datos)) { datos = d; mostrarLista(); }
  } catch (e) { console.error(e); setAviso("No se pudo leer listas.json. Revisa que lo subiste al repositorio."); }
}
function cargarLista(){
  mostrarLista();
  if (!cargarLista.iniciado) { cargarLista.iniciado = true; refrescar(); setInterval(refrescar, 60000); }
}

function pintarFilas(){
  const rows = $("rows"); rows.innerHTML = "";
  if (!canciones.length) {
    const v = document.createElement("div"); v.className = "vacio";
    v.textContent = editando ? "Aún no hay canciones. Busca una arriba y pulsa Agregar." : "Aún no hay canciones en esta lista.";
    rows.appendChild(v); return;
  }
  canciones.forEach((c, i) => {
    const prep = c.disponible && c.disponible > Date.now();
    const r = document.createElement("div");
    r.className = "row" + (c.docId === sonandoDocId ? " on" : "");
    const n = document.createElement("span"); n.className = "n"; n.textContent = i + 1;
    const info = document.createElement("span"); info.className = "info";
    const img = document.createElement("img"); img.alt = ""; img.src = c.thumb || CONFIG.foto;
    const tx = document.createElement("span"); tx.style.minWidth = "0";
    const t = document.createElement("span"); t.className = "t"; t.textContent = c.titulo;
    const a = document.createElement("span"); a.className = "a"; a.textContent = prep ? "Preparando… estará lista en unos minutos" : (c.artista || "");
    tx.appendChild(t); tx.appendChild(a); info.appendChild(img); info.appendChild(tx);
    const x = document.createElement("button"); x.className = "x"; x.textContent = "✕"; x.title = "Quitar de la lista"; x.setAttribute("aria-label", "Quitar " + c.titulo);
    x.onclick = ev => { ev.stopPropagation(); quitar(c); };
    r.appendChild(n); r.appendChild(info); r.appendChild(x);
    r.onclick = () => { if (prep) { toast("Esta canción se está publicando, espera unos minutos"); return; } if (c.docId === sonandoDocId && cola.length) toggle(); else { cola = canciones.slice(); play(i); } };
    rows.appendChild(r);
  });
}

/* ---------- Editar: token, agregar, quitar ---------- */
function setEditando(v){
  editando = v;
  document.body.classList.toggle("edit", v);
  $("btnEditar").textContent = v ? "Salir de edición" : "Editar listas";
  if (!v) { $("resultados").hidden = true; $("buscador").hidden = true; }
  pintarFilas();
}
$("btnEditar").onclick = () => {
  if (editando) { escribirLS(TOKEN_KEY, ""); setEditando(false); return; }
  const box = $("loginBox"); box.hidden = !box.hidden;
  if (!box.hidden) $("clave").focus();
};
async function entrar(){
  const t = $("clave").value.trim();
  if (!t) { toast("Pega el token de GitHub"); return; }
  if (!G.usuario || !G.repo) { toast("Falta el usuario y el repo de GitHub en CONFIG"); return; }
  try {
    const r = await fetch("https://api.github.com/repos/" + G.usuario + "/" + G.repo, { headers: { Authorization: "Bearer " + t, Accept: "application/vnd.github+json" } });
    if (!r.ok) throw new Error();
    escribirLS(TOKEN_KEY, t); $("clave").value = ""; $("loginBox").hidden = true; setEditando(true);
    if (abrirAlEntrar) { abrirAlEntrar = false; $("buscador").hidden = false; $("q").focus(); }
  } catch (e) { toast("Token incorrecto o sin acceso al repositorio"); }
}
$("btnEntrar").onclick = entrar;
$("clave").onkeydown = e => { if (e.key === "Enter") entrar(); };
if (token()) setEditando(true);

function agregar(item, listaId){
  if (!editando) { toast("Primero entra en Editar listas"); return Promise.reject(new Error("sin permiso")); }
  const lid = listaId || listaActual;
  return modificarListas(d => { (d[lid] = d[lid] || []).push(Object.assign({ docId: uid() }, item)); }, "Agregar " + item.titulo);
}
function quitar(c){
  if (!editando) return;
  if (!confirm("¿Quitar \"" + c.titulo + "\" de la lista?")) return;
  modificarListas(d => { d[listaActual] = (d[listaActual] || []).filter(x => x.docId !== c.docId); }, "Quitar " + c.titulo)
    .then(() => toast("Canción quitada")).catch(e => toast("No se pudo quitar: " + e.message));
}

/* Para tus propios mp3 (archivos en la carpeta musica): agregarCancionPropia("alexander", {titulo:"...", artista:"...", url:"musica/archivo.mp3"}) */
window.agregarCancionPropia = (listaId, d) => agregar({ tipo: "mp3", titulo: d.titulo, artista: d.artista || "", url: d.url, thumb: d.thumb || "" }, listaId);

/* ---------- Búsqueda en YouTube ---------- */
async function buscar(){
  const q = $("q").value.trim();
  if (!q) { toast("Escribe el nombre de una canción"); return; }
  const dl = CONFIG.evogbKey;
  const cont = $("resultados"); cont.hidden = false; cont.innerHTML = '<div class="nota">Buscando…</div>';
  try {
    const r = await fetch(CONFIG.buscaEndpoint + "?key=" + encodeURIComponent(dl) + "&query=" + encodeURIComponent(q));
    const j = await r.json();
    if (!j.status) throw new Error(j.reason || j.message || j.msg || ("HTTP " + r.status));
    cont.innerHTML = "";
    const items = (j.result || []).map(it => {
      const m = String(it.url || "").match(/[?&]v=([\w-]{11})/) || String(it.url || "").match(/youtu\.be\/([\w-]{11})/);
      return m ? { vid: m[1], titulo: it.title, canal: it.autor || "", dur: it.duration || "", thumb: it.banner || "" } : null;
    }).filter(Boolean).slice(0, 8);
    if (!items.length) { cont.innerHTML = '<div class="nota">No encontré nada. Prueba con otro nombre.</div>'; return; }
    items.forEach(v => {
      const fila = document.createElement("div"); fila.className = "it";
      const im = document.createElement("img"); im.alt = ""; im.src = v.thumb;
      const tx = document.createElement("div"); tx.className = "tx";
      const t = document.createElement("div"); t.className = "t"; t.textContent = v.titulo;
      const a = document.createElement("div"); a.className = "a"; a.textContent = v.canal + (v.dur ? " · " + v.dur : "");
      tx.appendChild(t); tx.appendChild(a);
      const bt = document.createElement("button"); bt.className = "btn"; bt.textContent = "Agregar";
      if (canciones.some(c => c.id === v.vid)) { bt.textContent = "Ya está"; bt.disabled = true; }
      bt.onclick = () => anadirMp3(v, bt);
      fila.appendChild(im); fila.appendChild(tx); fila.appendChild(bt);
      cont.appendChild(fila);
    });
  } catch (e) {
    console.error(e);
    cont.innerHTML = "";
    const n = document.createElement("div"); n.className = "nota";
    n.textContent = "No se pudo buscar: " + (e.message === "Failed to fetch" ? "el navegador bloqueó la conexión (CORS) con la API." : e.message);
    cont.appendChild(n);
  }
}

/* ---------- Añadir música: descarga mp3 + subida a GitHub ---------- */
function estado(t){ const e = $("estado"); e.textContent = t || ""; e.hidden = !t; }
function aBase64(buf){ const u = new Uint8Array(buf); let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }

$("btnAnadir").onclick = () => {
  if (!editando) { $("loginBox").hidden = false; $("clave").focus(); toast("Pega el token de GitHub para añadir música"); abrirAlEntrar = true; return; }
  const b = $("buscador"); b.hidden = !b.hidden; if (!b.hidden) $("q").focus();
};

async function anadirMp3(v, boton){
  if (!editando) { toast("Primero entra en Editar listas"); return; }
  const lista = listaActual;
  boton.disabled = true;
  try {
    estado("1/3 Pidiendo el mp3…");
    const r = await fetch(CONFIG.descargaEndpoint + "?key=" + encodeURIComponent(CONFIG.evogbKey) + "&url=" + encodeURIComponent("https://www.youtube.com/watch?v=" + v.vid));
    const j = await r.json();
    const enlace = j && j.data && j.data.dl;
    if (!j.status || !enlace) throw new Error("La API no devolvió enlace (" + (j.reason || j.message || j.msg || r.status) + ")");
    estado("2/3 Descargando el audio…");
    const f = await fetch(enlace);
    if (!f.ok) throw new Error("No se pudo bajar el archivo (" + f.status + ")");
    const contenido = aBase64(await f.arrayBuffer());
    estado("3/3 Subiendo al repositorio…");
    const ruta = "musica/" + v.vid + ".mp3";
    const u = await fetch(API + ruta, {
      method: "PUT",
      headers: Object.assign({ "Content-Type": "application/json" }, hdr()),
      body: JSON.stringify({ message: "Agregar " + v.titulo, content: contenido, branch: G.rama || "main" })
    });
    if (!u.ok && u.status !== 422) throw new Error("GitHub respondió " + u.status + (u.status === 401 ? " (token inválido)" : u.status === 403 ? " (al token le falta el permiso Contents: Read and write)" : ""));
    await agregar({ tipo: "mp3", id: v.vid, titulo: v.titulo, artista: v.canal, thumb: v.thumb, url: ruta, disponible: Date.now() + 150000 }, lista);
    boton.textContent = "Agregada";
    estado("Listo. Saldrá como «Preparando…» unos minutos mientras GitHub la publica.");
  } catch (e) {
    console.error(e); boton.disabled = false;
    estado("No se pudo agregar: " + (e.message === "Failed to fetch" ? "el navegador bloqueó la conexión (CORS) con la API." : e.message));
  }
}
setInterval(() => { if (canciones.some(c => c.disponible && c.disponible > Date.now() - 25000)) pintarFilas(); }, 20000);

$("btnBuscar").onclick = buscar;
$("q").onkeydown = e => { if (e.key === "Enter") buscar(); };

/* ---------- Reproductor ---------- */
let yt = null, ytListo = false;
window.onYouTubeIframeAPIReady = () => {
  yt = new YT.Player("ytplayer", {
    width: "100%", height: "100%",
    playerVars: { playsinline: 1, rel: 0, modestbranding: 1 },
    events: {
      onReady: () => { ytListo = true; yt.setVolume(audio.volume * 100); },
      onStateChange: e => {
        if (modo !== "yt") return;
        if (e.data === YT.PlayerState.ENDED) siguiente();
        else if (e.data === YT.PlayerState.PLAYING) setIcono(true);
        else if (e.data === YT.PlayerState.PAUSED) setIcono(false);
      },
      onError: () => { toast("Esa canción no se puede reproducir aquí. Paso a la siguiente."); setTimeout(siguiente, 1500); }
    }
  });
};

function setIcono(sonando){
  $("ppIcon").setAttribute("d", sonando ? PAUSE : PLAY);
}
function setProgreso(cur, dur){
  $("cur").textContent = fmt(cur);
  $("dur").textContent = fmt(dur);
  if (dur > 0) { $("seek").value = cur / dur * 100; fill($("seek")); }
}

function play(i){
  if (!cola.length) return;
  idx = (i + cola.length) % cola.length;
  const c = cola[idx];
  sonandoDocId = c.docId;
  $("npTitle").textContent = c.titulo;
  $("npArtist").textContent = c.artista || "";
  $("npImg").src = c.thumb || CONFIG.foto;
  setProgreso(0, 0);
  if (c.tipo === "mp3") {
    modo = "mp3";
    if (ytListo) yt.pauseVideo();
    $("ytwrap").style.display = "none";
    $("mp3box").style.display = "flex";
    $("mp3img").src = c.thumb || CONFIG.foto;
    audio.src = c.url;
    audio.play().catch(() => {});
  } else {
    if (!ytListo) { toast("El reproductor está cargando, prueba otra vez en un momento"); return; }
    modo = "yt";
    audio.pause();
    $("mp3box").style.display = "none";
    $("ytwrap").style.display = "block";
    yt.loadVideoById(c.id);
    yt.setVolume(audio.volume * 100);
  }
  pintarFilas();
}
function toggle(){
  if (idx < 0) { cola = canciones.slice(); return play(0); }
  if (modo === "yt" && ytListo) {
    yt.getPlayerState() === YT.PlayerState.PLAYING ? yt.pauseVideo() : yt.playVideo();
  } else if (modo === "mp3") {
    audio.paused ? audio.play() : audio.pause();
  }
}
function siguiente(){ if (cola.length) play(idx + 1); }
function anterior(){
  if (!cola.length) return;
  const cur = modo === "yt" && ytListo ? yt.getCurrentTime() : audio.currentTime;
  cur > 3 ? (modo === "yt" ? yt.seekTo(0, true) : (audio.currentTime = 0)) : play(idx - 1);
}

$("pp").onclick = toggle;
$("next").onclick = siguiente;
$("prev").onclick = anterior;

audio.onplay = () => { if (modo === "mp3") setIcono(true); };
audio.onpause = () => { if (modo === "mp3") setIcono(false); };
audio.onended = siguiente;
audio.onerror = () => { if (modo === "mp3" && idx >= 0) toast("No se encontró el archivo: " + cola[idx].url); };
audio.ontimeupdate = () => { if (modo === "mp3") setProgreso(audio.currentTime, audio.duration); };

setInterval(() => {
  if (modo === "yt" && ytListo && yt.getDuration) {
    const d = yt.getDuration();
    if (d > 0) setProgreso(yt.getCurrentTime(), d);
  }
}, 500);

$("seek").oninput = e => {
  const p = e.target.value / 100;
  if (modo === "yt" && ytListo) { const d = yt.getDuration(); if (d > 0) yt.seekTo(p * d, true); }
  else if (modo === "mp3" && audio.duration) audio.currentTime = p * audio.duration;
  fill(e.target);
};
$("vol").oninput = e => {
  audio.volume = e.target.value;
  if (ytListo) yt.setVolume(e.target.value * 100);
  fill(e.target);
};
audio.volume = 0.8; fill($("vol")); fill($("seek"));

document.addEventListener("keydown", e => {
  if (e.code === "Space" && e.target === document.body) { e.preventDefault(); toggle(); }
});

pintarTabs();
cargarLista();
</script>
